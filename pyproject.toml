[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donkey"
version = "0.1.0"
description = "donkey —— 面向个人开发者的 workspace 与 agent 运行框架"
requires-python = ">=3.11"
# donkey has exactly ONE runtime dependency (spec SC-021 / FR-067): the upstream
# saver package that owns the ``checkpoints`` / ``writes`` tables of the short-term
# memory DB. The lower bound MUST be ``>=3.1`` — only that range resolves
# ``langgraph-checkpoint>=4.3.0``; the known-bad combination
# ``langgraph-checkpoint-sqlite 3.1.1`` + ``langgraph-checkpoint 4.2.0`` raises
# ``ImportError: cannot import name 'writes_sort_key'`` on import.
dependencies = ["langgraph-checkpoint-sqlite>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[project.scripts]
donkey = "donkey.cli.cli_client:main"

[tool.setuptools.packages.find]
include = ["donkey*"]
namespaces = true

[tool.setuptools.package-data]
# ".gitignore.txt" MUST be listed explicitly — setuptools resolves package-data
# with ``glob(recursive=True)``, which filters out file NAMES starting with "."
# (the template source for the workspace's ``.gitignore`` entry). Omitting it
# keeps that source out of built wheels/sdists → "donkey init" then fails with
# exit 3 ("template source missing") on non-editable installs.
"donkey.core.workspace.templates" = ["**/*.txt", "**/*.json", ".gitignore.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["donkey", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# 仓库根即包根（``donkey/`` 与 ``tests/`` 同级），``src`` 下的 ``donkey`` 目录
# 名为包名而非源码根，故显式声明本包为第一方，import 分组才与分层一致。
known-first-party = ["donkey"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
files = ["donkey"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
no_implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
python_files = ["test_*.py", "verify_phase_*.py"]
