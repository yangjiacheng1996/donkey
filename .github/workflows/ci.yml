name: CI

# 仅**手动触发**（workflow_dispatch）—— 由 Maintainer 在需要时从 Actions 页
# 手动点起，不在 push / PR 上自动运行。
#
# 理由：本地命令清单已足够作为单个 Phase 的完成证据（宪法 §4.1 / §4.6 的
# 门禁要求是"可执行命令"，不要求每次推送都跑 CI），而自动触发会持续消耗
# Actions 配额。
#
# ⚠️ 触发条件可随时改回（加回 `push:` / `pull_request:` 即可），但**文件本身
# MUST 保留** —— 宪法 §6.3 例外 E-01 的到期闭合依据是"该文件已交付"，且
# F001-P3 的 spec FR-065 + `tests/e2e/phase/verify_phase_f001_p3.py`
# 场景 16（CI 交付检查）MUST 断言本文件存在且含下列四类命令。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Gate smoke — donkey import chain MUST NOT pull in an observability backend
        run: |
          python -c "import sys, donkey.core.api, donkey.cli.cli_client; assert 'langsmith' not in sys.modules, 'observability backend leaked into the donkey import chain'; print('gate smoke ok')"

      - name: Full test suite
        run: pytest tests/

      - name: Unit coverage (>= 80% on donkey.core)
        run: pytest tests/unit/ --cov=donkey.core --cov-fail-under=80

      - name: Lint (ruff)
        run: ruff check donkey/ tests/

      - name: Type check (mypy)
        run: mypy donkey/ tests/
